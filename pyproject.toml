[project]
name = "ai-lab-llm-gateway"
version = "0.1.2"
description = "LiteLLM 라우팅·폴백·비용 기록 데모 (mock 모드 기본)"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "litellm==1.108.3",
    "pyyaml==6.0.3",
    "python-dotenv==1.2.4",
]

[dependency-groups]
dev = ["pytest==9.2.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning:pydantic"]
